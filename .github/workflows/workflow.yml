name: workflow.yml
on:
  push:

jobs:
  build:
    name: "构建应用"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: go.sum

      - name: Build for Windows amd64
        run: GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -trimpath -v -o dist/school_sdk_go-windows-amd64-${{ github.ref_name }}.exe .

      - name: Build for Windows i386
        run: GOOS=windows GOARCH=386 go build -ldflags="-s -w" -trimpath -v -o dist/school_sdk_go-windows-i386-${{ github.ref_name }}.exe .

      - name: Build for Linux
        run: GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -trimpath -v -o dist/school_sdk_go-linux-amd64-${{ github.ref_name }} .

      - name: Build for macOS (Intel)
        run: GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -trimpath -v -o dist/school_sdk_go-darwin-amd64-${{ github.ref_name }} .

      - name: Build for macOS (Apple Silicon)
        run: GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -trimpath -v -o dist/school_sdk_go-darwin-arm64-${{ github.ref_name }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path:  dist/*
